<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" type="text/css" href="index.css">
	<title>Agendar Cita - Dayana Nails</title>
	<link rel="icon" type="image/png" href="img/Logo.png">
	<meta charset="utf-8">
</head>
<body class="fondopagina">
	<header class="encabezado">
		<div id="logotexto">
			<img class="imagen" src="img/Logo.png" width="100px" height="" title="LOGO PROGRAMACION">
			<h1 id="TITULOPRINCIPAL">
				<span class="E">DAYANA</span> <span class="Nai">NAILS</span>
			</h1>
		</div>
		<nav class="menu-navegacion">
			<a href="index.html" class="enlace-nav">INICIO</a>
			<a href="servicios.html" class="enlace-nav">SERVICIOS</a>
			<a href="galeria.html" class="enlace-nav">GALERÍA</a>
			<a href="sobremi.html" class="enlace-nav destacado">SOBRE MI</a>
		</nav>
	</header>
	<section class="menudecontenido">
		<div class="contenido-bienvenida">
			<h2 class="subtitulo-principal">Datos de la Cita</h2>
			
			<!-- FORMULARIO DE DATOS -->
			<form class="formulario-datos" id="miFormulario" onsubmit="mostrarMensaje(event)">
				<div class="grupo-campo">
					<label>Nombre Completo:</label>
					<input type="text" placeholder="Ej. María Pérez" required>
				</div>

				<div class="grupo-campo">
					<label>Número de Teléfono / WhatsApp:</label>
					<input type="tel" placeholder="Ej. 3001234567" required>
				</div>

				<div class="grupo-campo">
					<label>Selecciona el Servicio:</label>
					<select required>
						<option value="">-- Selecciona --</option>
						<option value="acrilicas">Uñas Acrílicas</option>
						<option value="semipermanente">Esmaltado Semipermanente</option>
						<option value="nailart">Nail Art</option>
						<option value="rusa">Manicura Rusa</option>
					</select>
				</div>

				<div class="botones-accion">
					<button type="submit" class="btn-principal">Enviar Datos</button>
				</div>
			</form>
			<div id="mensajeAgradecimiento" style="display: none; margin-top: 25px; text-align: center;">
				<h3 style="color: #111111; font-size: 20px; margin-bottom: 10px;">¡Gracias por tu solicitud!</h3>
				<p class="descripcion-estudio">Recibirás una llamada o un mensaje de WhatsApp pronto para confirmar la disponibilidad de tu fecha y hora.</p>
			</div>
			<script>
				function mostrarMensaje(event) {
					event.preventDefault(); 
					document.getElementById('miFormulario').style.display = 'none';
					document.getElementById('mensajeAgradecimiento').style.display = 'block';
				}
			</script>
		</div>
	</section>
</body>
</html>
